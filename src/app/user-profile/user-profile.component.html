<div class="main-content">
  <div class="container-fluid">
      <div class="row">
          <div class="col-md-8">
              <div class="card">
                  <div class="card-header card-header-danger">
                      <h4 class="card-title">Modifier Profil</h4>
                      <p class="card-category">Compléteer votre profil</p>
                  </div>
                  <div class="card-body">
                      <form>
                          <div class="row">
                              <div class="col-md-5">
                                <mat-form-field class="example-full-width">
                                    <input matInput placeholder="Numéro de CIN">
                                  </mat-form-field>
                              </div>
                              <div class="col-md-3">
                                  <mat-form-field class="example-full-width">
                                    <input matInput placeholder="Nom">
                                  </mat-form-field>
                              </div>
                              <div class="col-md-4">
                                  <mat-form-field class="example-full-width">
                                    <input matInput placeholder="Prénom" type="email">
                                  </mat-form-field>
                              </div>
                          </div>
                          <div class="row">
                              <div class="col-md-6">
                                <mat-form-field class="example-full-width">
                                  <input matInput placeholder="Adresse e-mail" type="text">
                                </mat-form-field>
                              </div>
                              <div class="col-md-6">
                                <mat-form-field class="example-full-width">
                                  <input matInput placeholder="Numéro de téléphone" type="number">
                                </mat-form-field>
                              </div>
                          </div>
                          <div class="row">
                              <div class="col-md-12">
                                <mat-form-field class="example-full-width">
                                  <input matInput placeholder="Mot de passe" type="password">
                                </mat-form-field>
                              </div>
                          </div>
                          <div class="row">
                              <div class="col-md-4">
                                <mat-form-field class="example-full-width">
                                  <input matInput placeholder="Résidence" type="text">
                                </mat-form-field>
                              </div>
                          </div>

                          <div class="row mt-3">
                           <div class="col-md-6">
                             <label class="form-label"><strong>Rôle :</strong></label>
                            <mat-radio-group aria-label="Sélectionner un rôle" class="d-flex flex-column">
                             <mat-radio-button value="agent" class="mb-2">Agent</mat-radio-button>
                             <mat-radio-button value="responsable">Responsable régionale</mat-radio-button>
                            </mat-radio-group>
                           </div> 
                          </div>

                          <button mat-raised-button type="submit" class="btn btn-danger pull-right">Modifier Profil</button>
                          <div class="clearfix"></div>
                      </form>
                  </div>
              </div>
          </div>

          <div class="col-md-4">
              <div class="card card-profile">
                  <div class="card-avatar">
                      <a href="javascript:void(0)">
                          <img class="img" src="./assets/img/logotelecom.png" />
                      </a>
                  </div>
                  <div class="card-body" *ngIf="user">
                   <h6 class="card-category text-gray">{{ user.role | titlecase }}</h6>
                   <h4 class="card-title">{{ user.prenom }} {{ user.nom }}</h4>
                   <p class="card-description">
                     Email : {{ user.mail }} <br>
                     Tél : {{ user.numtel }} <br>
                     Résidence : {{ user.residence }}
                   </p>
                    <a href="javascript:void(0)" class="btn btn-danger btn-round">voir profil</a>
                  </div>
              </div>
          </div>
      </div>
  </div>
</div>
