<div class="main-content">
  <div class="container-fluid">
    <div class="card">
        <div class="card-header card-header-danger">
            <h4 class="card-title">Gestion des réclamations</h4>
            <p class="card-category">Centralisez, traitez et suivez toutes vos réclamations efficacement</p>
        </div>
        <div class="card-body">
            <div id="typography">
                <div class="card-title">
                    <h2>Saisir une réclamation</h2>
                </div>
                <div class="row">
                              <div class="col-md-12">
                                <mat-form-field class="example-full-width">
                                   <textarea matInput placeholder="Saisir ici votre réclamation."></textarea>
                                 </mat-form-field>
                                 <button mat-raised-button type="submit" class="btn btn-danger pull-right">Envoyer</button>
                              </div>
                  </div>
            </div>
        </div>
    </div>
</div>
