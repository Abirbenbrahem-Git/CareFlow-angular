<div class="main-content">
  <div class="container-fluid">
      <div class="row">
          <div class="col-md-11">
              <div class="card">
                  <div class="card-header card-header-danger">
                      <h4 class="card-title">Nouveau Bulletin de soin</h4>
                      <p class="card-category">Remplir le formulaire</p>
                  </div>
                  <div class="card-body">
                      <form #bulletinForm="ngForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data">
                          <div class="row">
                              <div class="col-md-4">
                                <mat-form-field class="example-full-width">
                                    <input matInput placeholder="Référence BS" [(ngModel)]="bulletin.reference">
                                  </mat-form-field>
                              </div>
                              <div class="col-md-4">
                                  <mat-form-field class="example-full-width">
                                    <input matInput placeholder="Nom & Prénom de l'adhérent" [(ngModel)]="bulletin.nomadherent">
                                  </mat-form-field>
                              </div>
                              <div class="col-md-4">
                                  <mat-form-field class="example-full-width">
                                    <input matInput placeholder="Nom & Prénom du malade" [(ngModel)]="bulletin.nommalade">
                                  </mat-form-field>
                              </div>
                          </div>

                          <div class="row mt-3">
                            <div class="col-md-12">
                              <label class="form-label"style="margin-right: 30px;"><strong>Le malade est :</strong></label>
                              <mat-radio-group [(ngModel)]="bulletin.typemalade">
                               <mat-radio-button value="adherent" style="margin-right: 30px;">Adhérent</mat-radio-button>
                               <mat-radio-button value="conjoint" style="margin-right: 30px;">Conjoint</mat-radio-button>
                               <mat-radio-button value="enfant" class="me-4">Enfant</mat-radio-button>
                              </mat-radio-group>
                            </div>
                          </div>
                        
                          <div class="row">
                            <div class="col-md-6">
                              <mat-form-field class="example-full-width">
                                <input matInput placeholder="Date de naissance" type="date" [(ngModel)]="bulletin.datenaissance">
                              </mat-form-field>
                            </div>
                          </div>

                          <div class="row">
                              <div class="col-md-12">
                                <mat-form-field class="example-full-width">
                                  <input matInput placeholder="Adresse" type="text" [(ngModel)]="bulletin.adresse">
                                </mat-form-field>
                              </div>
                          </div>
                          <div class="row">
                              <div class="col-md-6">
                                <mat-form-field class="example-full-width">
                                  <input matInput placeholder="Date dépôt" type="date" [(ngModel)]="bulletin.datedepot">
                                </mat-form-field>
                              </div>
                              <div class="col-md-6">
                                <mat-form-field class="example-full-width">
                                  <input matInput placeholder="Date Soin" type="date" [(ngModel)]="bulletin.datesoin">
                                </mat-form-field>
                              </div>
                          </div>

                          <div class="row mt-3">
                           <div class="col-md-6">
                            <label for="justif" class="form-label"><strong>Joindre un justificatif</strong></label>
                            <input type="file" class="form-control" id="justif" (change)="onFileSelected($event)" accept="application/pdf">
                           </div>
                          </div>

                          <div class="d-flex justify-content-end gap-2 mt-3">
                            <button mat-raised-button type="button" class="btn btn-danger" style="margin-right: 30px;">Annuler</button>
                            <button mat-raised-button type="submit" class="btn btn-danger">Envoyer le dossier</button>
                          </div>
                          
                          <div class="clearfix"></div>
                      </form>
                  </div>
              </div>
          </div>       
      </div>
  </div>
</div>
